# Builds the debug APK and uploads it to Firebase App Distribution.
# Started by hand from the Actions tab ("Run workflow"), so not every push
# reaches testers.
name: Distribute debug build

on:
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same JDK as test.yml; see the note there.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # None of these files are in the public repo; they all come from secrets.
      # The keystore is binary, so its secret holds base64 and is decoded here.
      # The service account file is what the App Distribution plugin logs in with
      # (CI can't run `firebase login`); it's read via GOOGLE_APPLICATION_CREDENTIALS.
      - name: Restore secret files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - run: ./gradlew assembleDebug appDistributionUploadDebug
